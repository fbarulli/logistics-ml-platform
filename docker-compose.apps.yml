services:
  mlflow:
    image: ghcr.io/fbarulli/logistics-ml-platform-mlflow:latest
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/fbarulli/logistics-ml-platform-api:latest
    container_name: taxi-api
    depends_on:
      postgres:
        condition: service_started
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile
    container_name: taxi-etl
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:logistics@postgres:5432/logistics
    volumes:
      - ./src:/workspace/src
      - ./data:/workspace/data
    deploy:
      resources:
        limits:
          memory: 3g

  training:
    build:
      context: .
      dockerfile: docker/training/Dockerfile
    container_name: taxi-training
    depends_on:
      postgres:
        condition: service_started
      mlflow:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:logistics@postgres:5432/logistics
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./src:/workspace/src
      - ./data:/workspace/data
      - mlflow_artifacts:/mlflow/artifacts

volumes:
  mlflow_artifacts:
