services:

  postgres:
    image: postgres:16
    container_name: logistics-postgres
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  etl:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile
    container_name: taxi-etl
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:logistics@postgres:5432/logistics
    volumes:
      - ./src:/workspace/src
      - ./data:/workspace/data

  training:
    build:
      context: .
      dockerfile: docker/training/Dockerfile
    container_name: taxi-training
    depends_on:
      postgres:
        condition: service_started
      mlflow:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:logistics@postgres:5432/logistics
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./src:/workspace/src
      - mlflow_artifacts:/mlflow/artifacts

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: taxi-api

    depends_on:
      - postgres
      - mlflow

    ports:
      - "8000:8000"

    volumes:
      - mlflow_artifacts:/mlflow/artifacts

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile

    container_name: taxi-producer

    depends_on:
      - kafka

    volumes:
      - .:/workspace

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile

    container_name: taxi-consumer

    depends_on:
      kafka:
        condition: service_started
      api:
        condition: service_healthy

    volumes:
      - .:/workspace

volumes:

  postgres_data:

  mlflow_artifacts:
