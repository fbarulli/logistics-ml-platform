services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: taxi-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink/sql:/opt/flink/sql

  taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink/sql:/opt/flink/sql

  sql-gateway:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-sql-gateway
    depends_on:
      - jobmanager
    entrypoint:
      - /opt/flink/bin/sql-gateway.sh
    command:
      - start-foreground
      - -Dsql-gateway.endpoint.rest.address=0.0.0.0
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        sql-gateway.endpoint.rest.address: 0.0.0.0
        sql-gateway.endpoint.rest.port: 8083
    ports:
      - "8083:8083"
    volumes:
      - ./flink/sql:/opt/flink/sql

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: taxi-producer
    depends_on:
      - kafka
    volumes:
      - .:/workspace

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: taxi-consumer
    depends_on:
      - kafka
    volumes:
      - .:/workspace
