services:

  postgres:
    image: postgres:16
    container_name: logistics-postgres
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  mlflow:
    build:
      context: ./mlflow
    container_name: mlflow-server
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts


  training:
    build:
      context: ./training
    container_name: taxi-training
    depends_on:
      - postgres
      - mlflow


volumes:

  postgres_data:

  mlflow_artifacts:
