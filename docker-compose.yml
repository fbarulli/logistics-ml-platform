x-python-service: &python-service
  image: logistics-python:latest
  build:
    context: .
    dockerfile: docker/python/Dockerfile
  restart: unless-stopped
  networks:
    - logistics

services:
  postgres:
    image: postgres:16
    container_name: logistics-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logistics
    mem_limit: 4g
    mem_reservation: 1g

  kafka:
    image: apache/kafka:3.8.0
    container_name: taxi-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - logistics
    mem_limit: 2g
    mem_reservation: 512m

  mlflow:
    image: ghcr.io/fbarulli/logistics-ml-platform-mlflow:latest
    container_name: mlflow-server
    environment:
      BACKEND_STORE_URI: ${DATABASE_URL}
      DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - logistics
    mem_limit: 1g
    mem_reservation: 256m

  producer:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    command:
      - python
      - -m
      - logistics_ml.producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TRIPS_TOPIC}
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - logistics
    mem_limit: 512m
    mem_reservation: 128m

  consumer:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    command:
      - python
      - -m
      - logistics_ml.consumer
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_FEATURES_TOPIC}
    depends_on:
      - kafka
      - postgres
    restart: unless-stopped
    networks:
      - logistics
    mem_limit: 512m
    mem_reservation: 128m

  api:
    <<: *python-service
    container_name: taxi-api
    command: uvicorn logistics_ml.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - postgres
      - mlflow
    mem_limit: 1g
    mem_reservation: 256m

  training:
    <<: *python-service
    container_name: taxi-training
    command: python -m logistics_ml.training
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    depends_on:
      - postgres
      - mlflow
    mem_limit: 4g
    mem_reservation: 1g

  etl:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    command:
      - python
      - -u
      - -m
      - logistics_ml.etl.run
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - postgres
      - kafka
    networks:
      - logistics
    volumes:
      - ./data:/workspace/data
    mem_limit: 4g
    mem_reservation: 1g

  jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-jobmanager
    ports:
      - "8081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: ${JOBMANAGER_HOST}
    networks:
      - logistics
    mem_limit: 1g
    mem_reservation: 256m

  taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-taskmanager
    depends_on:
      - jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: ${JOBMANAGER_HOST}
    networks:
      - logistics
    mem_limit: 2g
    mem_reservation: 512m

  sql-gateway:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-sql-gateway
    ports:
      - "8083:8083"
    depends_on:
      - jobmanager
    networks:
      - logistics
    mem_limit: 1g
    mem_reservation: 256m


volumes:
  postgres_data:

networks:
  logistics:
    name: logistics-network
    driver: bridge
