x-python-service: &python-service
  image: logistics-python:latest
  build:
    context: .
    dockerfile: docker/python/Dockerfile
  networks:
    - logistics

services:
  postgres:
    image: postgres:16
    container_name: logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logistics
    mem_limit: 4g
    mem_reservation: 1g

  kafka:
    image: apache/kafka:3.8.0
    container_name: taxi-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - logistics
    mem_limit: 2g
    mem_reservation: 512m

  mlflow:
    image: ghcr.io/fbarulli/logistics-ml-platform-mlflow:latest
    container_name: mlflow-server
    restart: unless-stopped
    environment:
      BACKEND_STORE_URI: ${DATABASE_URL}
      DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - logistics
    mem_limit: 2g
    mem_reservation: 256m

  producer:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: taxi-producer
    restart: "no"
    command:
      - python
      - -m
      - logistics_ml.producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TRIPS_TOPIC}
    depends_on:
      - kafka
    networks:
      - logistics
    mem_limit: 512m
    mem_reservation: 128m

  consumer:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: taxi-consumer
    restart: "no"
    command:
      - python
      - -m
      - logistics_ml.consumer
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_FEATURES_TOPIC}
    depends_on:
      - kafka
      - postgres
    networks:
      - logistics
    mem_limit: 512m
    mem_reservation: 128m

  api:
    <<: *python-service
    container_name: taxi-api
    restart: "no"
    command: uvicorn logistics_ml.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - postgres
      - mlflow
    mem_limit: 1g
    mem_reservation: 256m

  training:
    <<: *python-service
    container_name: taxi-training
    restart: "no"
    command: sh -c "python -u -m logistics_ml.training 2>&1 | tee /workspace/logs/training.log"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      PYTHONUNBUFFERED: "1"
      GIT_PYTHON_REFRESH: "quiet"
    depends_on:
      - postgres
      - mlflow
    volumes:
      - ./data:/workspace/data
      - ./logs:/workspace/logs
      - ./src:/workspace/src
    mem_limit: 8g
    mem_reservation: 1g

  etl:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    restart: "no"
    command:
      - python
      - -u
      - -m
      - logistics_ml.etl.run
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - postgres
      - kafka
    networks:
      - logistics
    volumes:
      - ./data:/workspace/data
    mem_limit: 4g
    mem_reservation: 1g

  jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-jobmanager
    restart: "no"
    command: ["jobmanager"]
    ports:
      - "8081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: ${JOBMANAGER_HOST}
    networks:
      - logistics
    mem_limit: 1g
    mem_reservation: 256m

  taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-taskmanager
    restart: "no"
    command: ["taskmanager"]
    depends_on:
      - jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: ${JOBMANAGER_HOST}
    networks:
      - logistics
    mem_limit: 2g
    mem_reservation: 512m

  sql-gateway:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: taxi-sql-gateway
    restart: "no"
    command: ["/opt/flink/bin/sql-gateway.sh", "start-foreground", "-Dsql-gateway.endpoint.rest.address=0.0.0.0"]
    ports:
      - "8083:8083"
    depends_on:
      - jobmanager
    networks:
      - logistics
    mem_limit: 1g
    mem_reservation: 256m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - logistics
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 200m
    mem_reservation: 100m

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
    networks:
      - logistics
    mem_limit: 512m
    mem_reservation: 128m

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - logistics
    mem_limit: 300m
    mem_reservation: 128m

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logistics
    mem_limit: 100m
    mem_reservation: 50m


volumes:

  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  logistics:
    name: logistics-network
    driver: bridge
