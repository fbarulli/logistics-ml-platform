services:
  postgres:
    image: postgres:16
    container_name: logistics-postgres
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: taxi-api
    depends_on:
      - mlflow
      - postgres
    ports:
      - "8000:8000"
    volumes:
    - .:/workspace
    - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow-server
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  etl:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile
    container_name: taxi-etl
    depends_on:
      - postgres
    volumes:
      - .:/workspace

    working_dir: /workspace
    command: python -m logistics_ml.etl.run

  training:
    build:
      context: .
      dockerfile: docker/training/Dockerfile
    container_name: taxi-training
    depends_on:
      - postgres
      - mlflow
    working_dir: /workspace
    volumes:
      - .:/workspace
      - mlflow_artifacts:/mlflow/artifacts
    command: python -m logistics_ml.training
  kafka:
    image: apache/kafka:3.8.0
    container_name: taxi-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  producer:
    build:
      context: ./producer
    container_name: taxi-producer
    depends_on:
      - kafka

  consumer:
    build:
      context: ./consumer
    container_name: taxi-consumer
    depends_on:
      - kafka

volumes:
  postgres_data:

  mlflow_artifacts:
    external: true
    name: logistics-ml-platform_mlflow_artifacts


