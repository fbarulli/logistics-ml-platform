name: CD

on:
  push:
    branches: [**]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f service/Dockerfile \
            -t ghcr.io/fbarulli/logistics-ml-platform-api:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/fbarulli/logistics-ml-platform-api:latest
