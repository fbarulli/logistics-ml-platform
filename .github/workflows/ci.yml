name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Install project
        run: uv pip install -e .
      - name: Generate feature contract
        run: uv run python scripts/generate_feature_contract.py
      - name: Ensure generated files are committed
        run: git diff --exit-code
      - name: Validate Kubernetes manifests
        run: |
          kubectl apply \
            --dry-run=client \
            --validate=false \
            -f k8s/
      - name: Check Python entrypoints exist
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys
          compose = pathlib.Path("docker-compose.yml").read_text()
          modules = re.findall(r'logistics_ml\.([A-Za-z0-9_]+)', compose)
          missing = []
          for module in modules:
              path = pathlib.Path(f"src/logistics_ml/{module}.py")
              if not path.exists():
                  missing.append(module)
          if missing:
              print("Missing modules:", missing)
              sys.exit(1)
          PY

  build-python-base:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fbarulli/logistics-python-base
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/python/Dockerfile.base
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-python:
    needs: build-python-base
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fbarulli/logistics-python
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/python/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            BASE_IMAGE=ghcr.io/fbarulli/logistics-python-base:latest
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  mlflow-build:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fbarulli/logistics-ml-platform-mlflow
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push MLflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mlflow/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
