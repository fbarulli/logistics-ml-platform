name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build \
            -f service/Dockerfile \
            -t logistics-api:test \
            .

      - name: Verify package exists
        run: |
          docker run --rm logistics-api:test \
            python -c "import logistics_ml; print('OK')"
