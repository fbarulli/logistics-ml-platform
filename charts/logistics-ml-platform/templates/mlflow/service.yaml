apiVersion: v1
kind: Service
metadata:
  # Unprefixed: MLFLOW_TRACKING_URI=http://mlflow:5000 is hardcoded in training/etl/api.
  name: mlflow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logistics.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "logistics.selectorLabels" (dict "component" "mlflow" "context" .) | nindent 4 }}
  ports:
    - port: 5000
      targetPort: 5000
