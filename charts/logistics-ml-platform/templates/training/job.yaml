apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "logistics.fullname" . }}-training
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logistics.labels" . | nindent 4 }}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: {{ .Values.training.image }}
          imagePullPolicy: {{ .Values.training.pullPolicy }}
          command:
            - python
            - -u
            - -m
            - logistics_ml.training
          env:
            - name: DATABASE_URL
              value: {{ include "logistics.postgres.databaseUrl" . | quote }}
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GIT_PYTHON_REFRESH
              value: "quiet"
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow/artifacts
            - name: data
              mountPath: /workspace/data
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: {{ include "logistics.fullname" . }}-mlflow-artifacts-pvc
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "logistics.fullname" . }}-data-pvc
