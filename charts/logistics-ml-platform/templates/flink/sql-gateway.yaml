apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logistics.fullname" . }}-flink-sql-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logistics.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "logistics.selectorLabels" (dict "component" "sql-gateway" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logistics.selectorLabels" (dict "component" "sql-gateway" "context" .) | nindent 8 }}
    spec:
      containers:
        - name: sql-gateway
          image: {{ .Values.flink.image }}
          imagePullPolicy: {{ .Values.flink.pullPolicy }}
          command:
            - "./bin/sql-gateway.sh"
          args:
            - "start-foreground"
            - "-Dsql-gateway.endpoint.rest.address=0.0.0.0"
            - "-Dsql-gateway.endpoint.rest.port=8083"
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: jobmanager
          ports:
            - containerPort: 8083
          volumeMounts:
            - name: flink-sql
              mountPath: /opt/flink/sql/run.sql
              subPath: run.sql
            - name: flink-sql
              mountPath: /opt/flink/sql/generated/01-source.sql
              subPath: 01-source.sql
            - name: flink-sql
              mountPath: /opt/flink/sql/generated/02-sink.sql
              subPath: 02-sink.sql
            - name: flink-sql
              mountPath: /opt/flink/sql/generated/03-transform.sql
              subPath: 03-transform.sql
      volumes:
        - name: flink-sql
          configMap:
            name: {{ include "logistics.fullname" . }}-flink-sql
---
apiVersion: v1
kind: Service
metadata:
  name: sql-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logistics.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "logistics.selectorLabels" (dict "component" "sql-gateway" "context" .) | nindent 4 }}
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
