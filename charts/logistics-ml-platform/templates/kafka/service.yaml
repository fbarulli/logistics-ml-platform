apiVersion: v1
kind: Service
metadata:
  # Unprefixed: KAFKA_ADVERTISED_LISTENERS / KAFKA_CONTROLLER_QUORUM_VOTERS hardcode "kafka".
  name: kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logistics.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "logistics.selectorLabels" (dict "component" "kafka" "context" .) | nindent 4 }}
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
