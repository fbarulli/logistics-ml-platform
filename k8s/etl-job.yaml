apiVersion: batch/v1
kind: Job
metadata:
  name: etl
  namespace: database

spec:
  backoffLimit: 1

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: etl
          image: etl:local
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -u
            - -m
            - logistics_ml.etl.run

          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://logistics:logistics@postgres:5432/logistics"
