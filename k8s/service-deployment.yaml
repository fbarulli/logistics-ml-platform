apiVersion: apps/v1
kind: Deployment
metadata:
  name: service
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service
  template:
    metadata:
      labels:
        app: service
    spec:
      containers:
        - name: service
          image: service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: DATABASE_URL
              value: "postgresql+psycopg://logistics:logistics@postgres:5432/logistics"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow/artifacts
          startupProbe:
            tcpSocket:
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
