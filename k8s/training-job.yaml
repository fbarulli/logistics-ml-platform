apiVersion: batch/v1
kind: Job
metadata:
  name: training
  namespace: database
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: training:local
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow/artifacts
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
