apiVersion: batch/v1
kind: Job
metadata:
  name: training
  namespace: database

spec:
  backoffLimit: 1

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: training
          image: training:local
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -u
            - -m
            - logistics_ml.training

          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://logistics:logistics@postgres:5432/logistics"

            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"

            - name: PYTHONUNBUFFERED
              value: "1"

            - name: GIT_PYTHON_REFRESH
              value: "quiet"

          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow/artifacts
            - name: data
              mountPath: /workspace/data
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
